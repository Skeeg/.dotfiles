title = "Ryan's canonical gitleaks ruleset"

# Canonical base for every gitleaks consumer (dotfiles: .config/gitleaks/gitleaks.toml,
# live at ~/.config/gitleaks/gitleaks.toml). Consumers:
#   - repo configs extend it:   [extend] path = "/etc/gitleaks/base.toml"
#   - gitleaks containers mount it at /etc/gitleaks/base.toml (fixed path, so the
#     same child config resolves in pre-commit hooks, Alloy and ad-hoc scans)
#   - Alloy loki.secretfilter on ubuntuserver (sysadmin ADR-025)
#   - ~/bin/secrets-redact (default --config)
# Put portable rules and portable false-positive allowlists HERE; keep only
# repo-specific rules/allowlists in a repo's .gitleaks.toml.
#
# JSONL-safe variants (*-jsonl): 68% of gitleaks default rules end with the
# trailing boundary (?:[\x60'"\s;]|\\[nr]|$), which excludes ], } and , — the
# JSON structural characters. Secrets embedded in JSON log lines, Claude JSONL
# transcripts, or text like "[authorization: Bearer glsa_...]" are missed by the
# defaults. The *-jsonl variants drop the trailing anchor; the token prefixes are
# specific enough to avoid false positives. Benched 2026-09-27 through Alloy
# v1.20.0: defaults leaked 7/30 fake tokens, this set 0/30.
# Go RE2: no look-ahead/look-behind.

[extend]
useDefault = true

# ── Custom rules ──────────────────────────────────────────────────────────────
# Default ruleset reference: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml

[[rules]]
  id = "grafana-service-account-token-jsonl"
  description = "Grafana service account token (JSONL context, no trailing boundary)"
  regex = '''glsa_[A-Za-z0-9]{32}_[A-Fa-f0-9]{8}'''
  tags = ["grafana", "jsonl"]

[[rules]]
  id = "anthropic-api-key"
  description = "Anthropic / Claude API key"
  regex = '''sk-ant-(?:api\d\d-)?[A-Za-z0-9_\-]{90,}'''
  tags = ["anthropic", "ai"]

[[rules]]
  id = "openai-api-key-classic-jsonl"
  description = "OpenAI API key classic format (JSONL context, no trailing boundary)"
  regex = '''sk-[A-Za-z0-9]{48}'''
  tags = ["openai", "ai", "jsonl"]

[[rules]]
  id = "openai-api-key-project-jsonl"
  description = "OpenAI API key project format (JSONL context, no trailing boundary)"
  regex = '''sk-proj-[A-Za-z0-9_\-]{40,}'''
  tags = ["openai", "ai", "jsonl"]

[[rules]]
  id = "github-token-jsonl"
  description = "GitHub classic PAT / OAuth / App installation token (JSONL context)"
  regex = '''gh[poas]_[A-Za-z0-9]{36}'''
  tags = ["github", "jsonl"]

[[rules]]
  id = "github-fine-grained-pat-jsonl"
  description = "GitHub fine-grained PAT (JSONL context)"
  regex = '''github_pat_[A-Za-z0-9_]{82}'''
  tags = ["github", "jsonl"]

[[rules]]
  id = "slack-token-jsonl"
  description = "Slack bot / user / workspace / refresh token (JSONL context)"
  regex = '''xox[baprs]-[0-9A-Za-z\-]{24,}'''
  tags = ["slack", "jsonl"]

[[rules]]
  id = "1password-service-account-jsonl"
  description = "1Password service account token (JSONL context)"
  regex = '''ops_[A-Za-z0-9]{50,}'''
  tags = ["1password", "jsonl"]

[[rules]]
  id = "jwt-token"
  description = "JWT (three-part base64url) — common in AI session transcripts"
  regex = '''ey[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,}'''
  tags = ["jwt"]

[[rules]]
  id = "pluralsight-identity-session"
  description = "Pluralsight Identity.Session cookie (UUID session token)"
  regex = '''Identity\.Session(?:\.\w+)?=([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})'''
  secretGroup = 1
  tags = ["session", "pluralsight"]

[[rules]]
  id = "express-connect-sid"
  description = "Express.js signed session cookie (connect.sid=s%3A<id>.<sig>)"
  regex = '''connect\.sid=(s%3A[A-Za-z0-9_-]+\.[A-Za-z0-9%+_-]+)'''
  secretGroup = 1
  tags = ["session", "express"]

[[rules]]
  id = "aspnet-xsrf-token"
  description = "ASP.NET Core XSRF/CSRF token (Data Protection format, CfDJ8 prefix)"
  regex = '''XSRF-TOKEN=(CfDJ8[A-Za-z0-9_-]{40,})'''
  secretGroup = 1
  tags = ["csrf", "aspnet"]

[[rules]]
  id = "aspnet-antiforgery-cookie"
  description = "ASP.NET Core antiforgery cookie (Data Protection format, CfDJ8 prefix)"
  regex = '''\.AspNetCore\.Antiforgery\.[A-Za-z0-9_-]+=(CfDJ8[A-Za-z0-9_-]{40,})'''
  secretGroup = 1
  tags = ["csrf", "aspnet"]

[[rules]]
  id = "generic-openssl-uuid-token"
  description = "UUID-formatted random key (openssl rand -hex 16 | sed) following 'Token ' or 'token '"
  regex = '''[Tt]oken ([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})'''
  secretGroup = 1
  tags = ["generic", "uuid"]

[[rules]]
  id = "generic-openssl-base64-token"
  description = "Random base64 key (openssl rand | base64 pattern) following 'Token ' or 'token '"
  regex = '''[Tt]oken ([A-Za-z0-9+/]{32,}={0,2})'''
  secretGroup = 1
  tags = ["generic", "base64"]

[[rules]]
  id = "bruno-yaml-m2m-client-secret"
  description = "Auth0 M2M client_secret value in Bruno Open Collection YAML environment"
  regex = '''name:\s+m2m_client_secret\s+value:\s+([A-Za-z0-9_\-]{40,})'''
  secretGroup = 1
  tags = ["auth0", "m2m", "bruno"]

[[rules]]
  id = "bruno-yaml-named-secret"
  description = "Secret/password value in Bruno Open Collection YAML environment (name contains sentinel keyword)"
  regex = '''name:\s+\w*(?:secret|password|passwd|api_key|apikey)\w*\s+value:\s+([A-Za-z0-9_\-]{20,})'''
  secretGroup = 1
  tags = ["bruno", "yaml", "generic"]

[[rules]]
  id = "grafana-cloud-api-token-jsonl"
  description = "Grafana Cloud API / access policy token (JSONL context, no trailing boundary)"
  regex = '''glc_[A-Za-z0-9+/]{32,400}={0,2}'''
  tags = ["grafana", "jsonl"]

[[rules]]
  id = "generic-credential-assignment-jsonl"
  description = "High-entropy value assigned to a password/secret/token/api_key name (JSONL context). First value char excludes '/' so file paths (/run/secrets/...) don't match."
  regex = '''(?i)[\w.-]{0,40}(?:passw(?:or)?d|secret|token|api[_-]?key)[\w.-]{0,20}\s{0,3}(?:=|:|=>)\s{0,3}["']?([A-Za-z0-9+_\-][A-Za-z0-9+/_\-]{15,127})'''
  secretGroup = 1
  entropy = 3.5
  tags = ["generic", "jsonl"]


# ── Password / credential shapes (2026-10-01, password-leak harness) ─────────
# Added after a harness of 30 leak shapes x 5 value kinds through gitleaks and
# Alloy loki.secretfilter (plain, JSONL, and Claude Code OTLP attribute nesting)
# found 60-75% of fake password leaks passing. Values: >= 8 chars, any printable
# non-space except quotes/backslash; first char may not be $ < { ( so env
# references, placeholders and templates pass; absolute paths and %VAR% /
# %(name)s references pass via allowlists below. Quotes may carry 1-3
# escaping backslashes (JSONL, and Claude Code OTLP attributes are JSON inside
# JSON); a lone backslash never counts as a quote, so \u003c-escaped text
# (Go's JSON encoder) is not misread. =\u003e and \u003c..\u003e cover => and
# <tag> after that encoding.

[[rules]]
  id = "password-assignment"
  description = "Password-like value assigned to a password/secret/token/api_key/pass/pwd name (env, YAML, JSON, INI, PHP; quotes may be JSON-escaped)"
  regex = '''(?i)(?:passw(?:or)?d|passwd|(?:\b|_|\\[nrt])(?:pass|pwd|secret|token|api[_-]?key))(?:[_.][\w.]{0,20})?(?:\\{1,3}["']|["'])?[ \t]{0,3}(?:=>|=\\u003e|=|:)[ \t]{0,3}(?:\\{1,3}["']|["'])?([^\s"'\\$<>{}()\[\],;:|`-][^\s"'\\<>{}()\[\],;:|`]{7,127})'''
  secretGroup = 1
  entropy = 2.5
  keywords = ["pass", "pwd", "secret", "token", "api_key", "apikey", "api-key"]
  tags = ["password", "generic"]
  [[rules.allowlists]]
    # Scoped to this rule so it cannot suppress other rules' findings.
    description = "password-assignment: pointers, references, names, markers"
    regexTarget = "match"
    regexes = [
      # *_FILE keys name a file: PASSWORD_FILE=/run/secrets/x, WEBPASSWORD_FILE: name
      '''(?i)^[\w.-]*_FILE(?:\\{1,3}["']|["'])?\s{0,3}(?:=|:)''',
      # metadata keys: secret_name, token_type, token_url, password_min_length ...
      '''(?i)^[\w.-]*(?:_name|_id|_type|_url|_uri|_path|_ref|_arn|_env|_length|_policy|_ttl|_expiry|_expires|_hint)(?:\\{1,3}["']|["'])?\s{0,3}(?:=|:)''',
      # value is an absolute path, %VAR% (Windows) or %(name)s (Python)
      '''(?:=|:)\s{0,3}(?:\\{1,3}["']|["'])?/[\w.@/-]*$''',
      '''(?:=|:)\s{0,3}(?:\\{1,3}["']|["'])?%(?:[A-Za-z_][A-Za-z0-9_]*%|\([\w.]+\)s)$''',
      # value is an env var name (UPPER_SNAKE with an underscore)
      '''(?:=|:)\s{0,3}(?:\\{1,3}["']|["'])?[A-Z][A-Z0-9]*_[A-Z0-9_]+(?:\.[a-z]{1,5})?$''',
      # value is a dotted code identifier: config.db_password, self.token, os.environ
      '''(?:=|:)\s{0,3}(?:\\{1,3}["']|["'])?[a-z_][a-z0-9_]*(?:\.[a-z_][a-z0-9_]*)+$''',
      # inside a redaction marker (<ALLOY-REDACTED-SECRET:rule:hash>, REDACTED)
      '''REDACTED''',
      # the rule-id part of a marker: SECRET:github-pat, SECRET:generic-credential-assignment-jsonl
      '''(?i)^SECRET:[a-z]+(?:-[a-z0-9]+)+$''',
    ]
  [[rules.allowlists]]
    description = "placeholders and already-redacted text"
    regexTarget = "secret"
    regexes = [
      '''(?i)^(?:changeme|change_me|placeholder|example|redacted|secret|password|passw0rd|your[_-]?[a-z_]*|x{3,}|\*{3,}|todo|tbd|none|null|dummy|test|testing|sample|hunter2)\d{0,2}$''',
      '''REDACTED''',
    ]

[[rules]]
  id = "url-userinfo-password"
  description = "Password in URL userinfo (scheme://user:password@host)"
  regex = '''[a-zA-Z][a-zA-Z0-9+.-]{1,20}://[^\s:/@"'\\]{0,64}:([^\s:/@"'\\<\[${][^\s:/@"'\\]{5,127})@[\w.-]+'''
  secretGroup = 1
  entropy = 2.5
  keywords = ["://"]
  tags = ["password", "url"]
  [[rules.allowlists]]
    description = "placeholders and already-redacted text"
    regexTarget = "secret"
    regexes = [
      '''(?i)^(?:changeme|change_me|placeholder|example|redacted|secret|password|passw0rd|your[_-]?[a-z_]*|x{3,}|\*{3,}|todo|tbd|none|null|dummy|test|testing|sample|hunter2)\d{0,2}$''',
      '''REDACTED''',
    ]

[[rules]]
  id = "cli-password-flag"
  description = "Password passed as a CLI flag (--password=x, --password x, --passwd, --pass, sshpass -p x)"
  regex = '''(?i)(?:--(?:password|passwd|pass|pwd)|\bsshpass\s+-p)(?:=|\s+)(?:\\{1,3}["']|["'])?([^\s"'\\$<{(-][^\s"'\\]{5,127})'''
  secretGroup = 1
  entropy = 2.5
  keywords = ["--pass", "--pwd", "sshpass"]
  tags = ["password", "cli"]
  [[rules.allowlists]]
    description = "placeholders and already-redacted text"
    regexTarget = "secret"
    regexes = [
      '''(?i)^(?:changeme|change_me|placeholder|example|redacted|secret|password|passw0rd|your[_-]?[a-z_]*|x{3,}|\*{3,}|todo|tbd|none|null|dummy|test|testing|sample|hunter2)\d{0,2}$''',
      '''REDACTED''',
    ]

[[rules]]
  id = "mysql-inline-password"
  description = "mysql/mariadb client password glued to -p (-pSECRET)"
  regex = '''\b(?:mysql|mariadb|mysqldump|mysqladmin)\b[^\n|;&]{0,80}?\s-p([^\s"'\\$<{(-][^\s"'\\]{5,127})'''
  secretGroup = 1
  entropy = 2.5
  keywords = ["mysql", "mariadb"]
  tags = ["password", "cli"]
  [[rules.allowlists]]
    description = "placeholders and already-redacted text"
    regexTarget = "secret"
    regexes = [
      '''(?i)^(?:changeme|change_me|placeholder|example|redacted|secret|password|passw0rd|your[_-]?[a-z_]*|x{3,}|\*{3,}|todo|tbd|none|null|dummy|test|testing|sample|hunter2)\d{0,2}$''',
      '''REDACTED''',
    ]

[[rules]]
  id = "curl-user-password"
  description = "curl -u/--user user:password"
  regex = '''\bcurl\b[^\n|;&]{0,200}?\s(?:-u|--user)\s+(?:\\{1,3}["']|["'])?[^\s:"'\\]{1,64}:([^\s"'\\<\[${][^\s"'\\]{5,127})'''
  secretGroup = 1
  entropy = 2.5
  keywords = ["curl"]
  tags = ["password", "cli"]
  [[rules.allowlists]]
    description = "placeholders and already-redacted text"
    regexTarget = "secret"
    regexes = [
      '''(?i)^(?:changeme|change_me|placeholder|example|redacted|secret|password|passw0rd|your[_-]?[a-z_]*|x{3,}|\*{3,}|todo|tbd|none|null|dummy|test|testing|sample|hunter2)\d{0,2}$''',
      '''REDACTED''',
    ]

[[rules]]
  id = "smb-user-percent-password"
  description = "smbclient/mount.cifs -U user%password"
  regex = '''\s-U\s+(?:\\{1,3}["']|["'])?[^\s%"'\\]{1,64}%([^\s"'\\<\[${][^\s"'\\]{5,127})'''
  secretGroup = 1
  entropy = 2.5
  keywords = ["-u "]
  tags = ["password", "cli"]
  [[rules.allowlists]]
    description = "placeholders and already-redacted text"
    regexTarget = "secret"
    regexes = [
      '''(?i)^(?:changeme|change_me|placeholder|example|redacted|secret|password|passw0rd|your[_-]?[a-z_]*|x{3,}|\*{3,}|todo|tbd|none|null|dummy|test|testing|sample|hunter2)\d{0,2}$''',
      '''REDACTED''',
    ]

[[rules]]
  id = "http-basic-auth-header"
  description = "HTTP Authorization: Basic <base64 user:password>"
  regex = '''(?i)authorization:\s*basic\s+([A-Za-z0-9+/]{12,}={0,2})'''
  secretGroup = 1
  keywords = ["basic"]
  tags = ["password", "http"]
  [[rules.allowlists]]
    description = "placeholders and already-redacted text"
    regexTarget = "secret"
    regexes = [
      '''(?i)^(?:changeme|change_me|placeholder|example|redacted|secret|password|passw0rd|your[_-]?[a-z_]*|x{3,}|\*{3,}|todo|tbd|none|null|dummy|test|testing|sample|hunter2)\d{0,2}$''',
      '''REDACTED''',
    ]

[[rules]]
  id = "xml-password-element"
  description = "Password in an XML element (<password>x</password>)"
  regex = '''(?i)(?:<|\\u003c)(?:password|passwd|pwd|secret)(?:>|\\u003e)([^<\s\\]{6,128})(?:<|\\u003c)/'''
  secretGroup = 1
  entropy = 2.5
  keywords = ["pass", "pwd", "secret"]
  tags = ["password", "xml"]
  [[rules.allowlists]]
    description = "placeholders and already-redacted text"
    regexTarget = "secret"
    regexes = [
      '''(?i)^(?:changeme|change_me|placeholder|example|redacted|secret|password|passw0rd|your[_-]?[a-z_]*|x{3,}|\*{3,}|todo|tbd|none|null|dummy|test|testing|sample|hunter2)\d{0,2}$''',
      '''REDACTED''',
    ]

[[rules]]
  id = "cli-tool-password-arg"
  description = "Password passed to a tool's own short flag or positional slot: redis-cli -a, ldap* -w, docker/podman/helm login -p, htpasswd -b, .netrc"
  regex = '''(?:\bredis-cli\b[^\n|;&]{0,160}?\s-a|\bldap(?:search|add|modify|delete|passwd|whoami|compare|modrdn)\b[^\n|;&]{0,200}?\s-w|\b(?:docker|podman|nerdctl|helm(?:\s+registry)?)\s+login\b[^\n|;&]{0,200}?\s-p|\bmachine\s+[^\s]+\s+login\s+[^\s]+\s+password)[ \t]+(?:\\{1,3}["']|["'])?([^\s"'\\$<{(\[-][^\s"'\\]{5,127})'''
  secretGroup = 1
  entropy = 2.5
  keywords = ["redis-cli", "ldap", "login", "machine"]
  tags = ["password", "cli"]
  [[rules.allowlists]]
    description = "placeholders and already-redacted text"
    regexTarget = "secret"
    regexes = [
      '''(?i)^(?:changeme|change_me|placeholder|example|redacted|secret|password|passw0rd|your[_-]?[a-z_]*|x{3,}|\*{3,}|todo|tbd|none|null|dummy|test|testing|sample|hunter2)\d{0,2}$''',
      '''REDACTED''',
    ]

[[rules]]
  id = "htpasswd-batch-password"
  description = "htpasswd -b (batch mode) takes the password as its last argument"
  regex = '''\bhtpasswd\b[^\n|;&]{0,40}?\s-[a-zA-Z]*b[a-zA-Z]*\s+(?:[^\s]+\s+){1,2}(?:\\{1,3}["']|["'])?([^\s"'\\$<{(\[-][^\s"'\\]{5,127})(?:\\{1,3}["']|["'])?[ \t]*(?:$|[|;&\n\\"])'''
  secretGroup = 1
  entropy = 2.5
  keywords = ["htpasswd"]
  tags = ["password", "cli"]
  [[rules.allowlists]]
    description = "placeholders and already-redacted text"
    regexTarget = "secret"
    regexes = [
      '''(?i)^(?:changeme|change_me|placeholder|example|redacted|secret|password|passw0rd|your[_-]?[a-z_]*|x{3,}|\*{3,}|todo|tbd|none|null|dummy|test|testing|sample|hunter2)\d{0,2}$''',
      '''REDACTED''',
    ]

# ── Portable allowlists ───────────────────────────────────────────────────────
# Untargeted [[allowlists]] propagate through [extend] path. Allowlists with
# targetRules do NOT: verified 2026-09-30 on gitleaks v8.30.1, a targeted base
# allowlist suppressed findings when the base was scanned directly but not in any
# child that extends it. So never use targetRules here; narrow with
# regexTarget = "match" and an anchored regex instead. Never regexTarget = "line":
# a JSONL transcript line holds a whole conversation, so one benign token would
# hide every real secret on it. The deprecated [allowlist] table cannot sit
# alongside [[allowlists]] in one file (gitleaks refuses to load). Child configs
# may still use [allowlist]. Alloy v1.20.0 loads [[allowlists]] and rule-level
# [[rules.allowlists]] (verified 2026-10-01, including through [extend]); still test
# changes in a scratch Alloy before re-syncing its copy (sysadmin
# grafana/gitleaks-base.toml). Document why each entry is safe.

[[allowlists]]
  description = "Syncthing device IDs"
  regexes = [
    # Syncthing device IDs — base32-encoded public node identifiers, not secrets.
    # Format: XXXXXXX-XXXXXXX-XXXXXXX-XXXXXXX-XXXXXXX-XXXXXXX-XXXXXXX-XXXXXXX
    '''[A-Z2-7]{7}-[A-Z2-7]{7}-[A-Z2-7]{7}-[A-Z2-7]{7}-[A-Z2-7]{7}-[A-Z2-7]{7}-[A-Z2-7]{7}-[A-Z2-7]{7}''',
  ]

[[allowlists]]
  description = "OAuth client IDs"
  # Client IDs are public identifiers (sent in browser redirects), not secrets.
  # generic-api-key fires on them via the "auth"/"key" keywords (AUTH0_CLIENT_ID).
  # The anchored match target holds the key name only for keyword rules;
  # token-format rules (github-pat, ...) match just the token, so a real token
  # stored under a *CLIENT_ID key still fires. *_CLIENT_SECRET is unaffected.
  regexTarget = "match"
  regexes = [
    '''(?i)^[\w.-]*client[_.-]?id['"]?\s*(?:=|:|=>)''',
  ]

[[allowlists]]
  description = "AWS Secrets Manager ARNs"
  # arn:aws:secretsmanager:<region>:<acct>:secret:<name>-XXXXXX names a secret,
  # it isn't one. generic-credential-assignment-jsonl matches from "secret:" to
  # the end of the name. The anchored regex requires "secret:" with no space and
  # an ARN-name charset ending in "/" (name prefix) or "-XXXXXX" (the 6-char
  # suffix AWS appends), so "secret: <value>", "secret:<value>" and
  # "API_SECRET:<value>" still fire.
  regexTarget = "match"
  regexes = [
    '''^secret:[A-Za-z0-9/_+=.@-]*(?:/|-[A-Za-z0-9]{6})$''',
  ]
